[package]
name = "checker_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Use rustls instead of native-tls to avoid openssl version hell
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "cookies", "gzip", "rustls-tls"] }
scraper = "=0.17.1"
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
csv = "=1.3.0"
url = "=2.4.1"
clap = { version = "=4.4.18", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
