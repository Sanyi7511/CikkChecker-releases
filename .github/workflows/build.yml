name: Build CikkChecker Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzio (pl. v3.1.0)'
        required: true
        default: 'v3.0.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag es verzio beallitasa
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading "v" for the version number itself
          VERSION="${RAW#v}"
          echo "RELEASE_TAG=${RAW}" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Tag letrehozasa (kezzel inditasnal)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ env.RELEASE_TAG }}"
          git push origin "${{ env.RELEASE_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Write version into version.txt so the app knows its own version ──
      - name: Verzio beirasa version.txt-be
        shell: bash
        run: echo "${{ env.APP_VERSION }}" > version.txt

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rust telepitese
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "checker_core_src -> target"

      - name: checker_core.exe forditasa
        shell: cmd
        run: |
          cd checker_core_src
          cargo build --release
          copy target\release\checker_core.exe ..\checker_core.exe

      - name: Python csomagok + PyInstaller
        shell: cmd
        run: pip install pywebview requests openpyxl pillow pyinstaller

      - name: app.exe buildelese (PyInstaller)
        shell: cmd
        run: |
          pyinstaller --onedir --noconsole --name "CikkChecker" ^
            --icon "assets\icon.ico" ^
            --add-data "ui;ui" ^
            --add-data "assets;assets" ^
            --add-data "version.txt;." ^
            app.py

      - name: Inno Setup telepito
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          arguments: /DMyAppVersion=${{ env.APP_VERSION }}

      - name: Output mappa ellenorzese
        shell: bash
        run: |
          echo "Output mappa tartalma:"
          ls -la Output/ || echo "Output mappa nem letezik!"

      - name: Build ellenorzese
        shell: bash
        run: |
          echo "PyInstaller dist mappa:"
          ls dist/CikkChecker/ | head -10
          echo "Output mappa:"
          ls Output/ 2>/dev/null || echo "(ures)"

      - name: Kod alairashoz tanusitvany letrehozasa
        shell: powershell
        run: |
          # Self-signed code signing certificate
          $cert = New-SelfSignedCertificate `
            -Subject "CN=CikkChecker, O=Sanyi7511, L=Hungary" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Type CodeSigningCert `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "CikkCheckerSign2024!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "codesign.pfx" -Password $pwd
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          echo "Tanusitvany letrehozva: $($cert.Thumbprint)"

      - name: Exe fajlok alairaasa (signtool)
        shell: cmd
        run: |
          :: Find signtool
          for /r "C:\Program Files (x86)\Windows Kits" %%f in (signtool.exe) do set SIGNTOOL=%%f
          echo Signtool: %SIGNTOOL%

          :: Sign main exe
          "%SIGNTOOL%" sign ^
            /f codesign.pfx ^
            /p CikkCheckerSign2024! ^
            /fd SHA256 ^
            /tr http://timestamp.digicert.com ^
            /td SHA256 ^
            /v ^
            "dist\CikkChecker\CikkChecker.exe"

          :: Sign Rust binary
          "%SIGNTOOL%" sign ^
            /f codesign.pfx ^
            /p CikkCheckerSign2024! ^
            /fd SHA256 ^
            /tr http://timestamp.digicert.com ^
            /td SHA256 ^
            /v ^
            "checker_core.exe"
        continue-on-error: true

      - name: Installer atnevezese es alairaasa
        shell: powershell
        run: |
          $found = Get-ChildItem Output\*.exe | Select-Object -First 1
          if (-not $found) { Write-Error "Nem talaltam .exe-t az Output mappaban!"; exit 1 }
          Write-Host "Talalt: $($found.FullName)"

          $dest = "Output\CikkCheckerSetup_${{ env.APP_VERSION }}.exe"
          Copy-Item $found.FullName $dest

          # Sign the setup exe too
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          if ($signtool) {
            & $signtool sign /f codesign.pfx /p "CikkCheckerSign2024!" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $dest
            Write-Host "Setup alairas kesz"
          }
          Write-Host "Kesz: $dest"

      - name: GitHub Release letrehozasa
        shell: bash
        run: |
          gh release create "${{ env.RELEASE_TAG }}"             "Output/CikkCheckerSetup_${{ env.APP_VERSION }}.exe"             --title "CikkChecker ${{ env.RELEASE_TAG }}"             --notes "## CikkChecker ${{ env.RELEASE_TAG }}

          ### Telepites
          1. Töltsd le a CikkCheckerSetup_${{ env.APP_VERSION }}.exe fajlt
          2. Futtasd telepitokent — Kesz!

          ### Automatikus frissites
          Az alkalmazas automatikusan eszleli az uj verziokat
          es letolti azokat, amint megjelennek.

          ### Rendszerkovetelmenyek
          - Windows 10 / 11 (64-bit)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
