name: Build CikkChecker Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python telepítése
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rust telepítése
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "checker_core_src -> target"

      - name: checker_core.exe fordítása
        shell: cmd
        run: |
          cd checker_core_src
          cargo build --release
          copy target\release\checker_core.exe ..\checker_core.exe

      - name: Python csomagok + PyInstaller
        shell: cmd
        run: pip install customtkinter pillow openpyxl requests pystray pyinstaller

      - name: app.exe buildelése (PyInstaller)
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole --name "CikkChecker" app.py
          echo === dist tartalom ===
          dir dist\
          copy dist\CikkChecker.exe CikkChecker_app.exe

      - name: Inno Setup telepítő készítése
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: GitHub Release létrehozása
        uses: softprops/action-gh-release@v2
        with:
          files: Output/CikkCheckerSetup.exe
          name: "CikkChecker ${{ github.ref_name }}"
          body: |
            ## CikkChecker ${{ github.ref_name }}

            ### Telepítés
            1. Töltsd le a `CikkCheckerSetup.exe` fájlt
            2. Futtasd telepítőként
            3. Kész – asztali parancsikonból indítható

            ### Rendszerkövetelmény
            - Windows 10 / 11 (64-bit)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
